name: Sync vault and deploy

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 * * * *"   # runs hourly; adjust or remove as you like
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quartz repo
        uses: actions/checkout@v4

      - name: Checkout vault repo
        uses: actions/checkout@v4
        with:
          repository: catherine2718/ml-notes
          token: ${{ secrets.VAULT_PAT }}
          path: vault-checkout

      - name: Copy notes into Quartz content folder
        run: |
          rm -rf content/*
          cp -r vault-checkout/* content/
          # adjust the line above if you only want specific folders public,
          # e.g. cp -r vault-checkout/public-notes/* content/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: sync-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
